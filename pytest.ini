[pytest]
# Configuração do pytest para o Sistema de Biblioteca Digital

# Padrões de descoberta de testes
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções padrão
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    
# Diretórios a serem ignorados
norecursedirs = .git .tox dist build *.egg venv

# Markers customizados
markers =
    unit: Testes unitários isolados
    integration: Testes de integração
    e2e: Testes end-to-end
    slow: Testes que demoram mais tempo
    
# Configurações de cobertura (AGORA COMPLETA)
[coverage:run]
source = .
omit =
    test_*
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*
    setup.py
    exemplos_uso.py
    
[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*:\s*$
    ^\s*$
    ^\s*"""$
    ^\s*'''$
    ^\s*#.*$

[coverage:html]
directory = htmlcov